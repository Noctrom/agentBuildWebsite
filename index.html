<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Always dark (S23). Keep theme-color in sync with --theme-bg in
         src/styles/index.css. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05060f" />
    <!-- Site-wide metadata defaults. PLACEHOLDER: replace the text with real
         info (keep the name in sync with profile.name in src/content/profile.ts).
         Tags with data-default-meta are swapped out by PageMeta
         (src/components/ui/PageMeta.tsx) on pages that set their own; keep
         the attribute. Open Graph / Twitter tags stay site-wide: link-preview
         crawlers read this file without running JS. -->
    <title data-default-meta>Jane Placeholder</title>
    <meta
      data-default-meta
      name="description"
      content="Placeholder site description: lorem ipsum dolor sit amet, the personal website of Jane Placeholder."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jane Placeholder" />
    <meta
      property="og:description"
      content="Placeholder site description: lorem ipsum dolor sit amet, the personal website of Jane Placeholder."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
