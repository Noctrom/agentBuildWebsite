<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Always dark (S23). Keep theme-color in sync with --theme-bg in
         src/styles/index.css. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05060f" />
    <!-- V0.49: set data-motion on <html> before first paint, so a saved
         Animation "Off" never flashes UI motion. Mirrors getReducedMotion()
         in src/components/layout/motionPreference.ts (same storage key,
         values and media query): keep the two in sync. The app keeps the
         attribute up to date after this. -->
    <script>
      (function () {
        var c = null, r
        try { c = localStorage.getItem('motion-preference') } catch (e) {}
        if (c === 'on') r = false
        else if (c === 'off' || c === 'auto-paused') r = true
        else r = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)
        document.documentElement.setAttribute('data-motion', r ? 'reduce' : 'full')
      })()
    </script>
    <!-- Site-wide metadata defaults. PLACEHOLDER: replace the text with real
         info (keep the name in sync with profile.name in src/content/profile.ts).
         Tags with data-default-meta are swapped out by PageMeta
         (src/components/ui/PageMeta.tsx) on pages that set their own; keep
         the attribute. Open Graph / Twitter tags stay site-wide: link-preview
         crawlers read this file without running JS. -->
    <title data-default-meta>Jane Placeholder</title>
    <meta
      data-default-meta
      name="description"
      content="Placeholder site description: lorem ipsum dolor sit amet, the personal website of Jane Placeholder."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jane Placeholder" />
    <meta
      property="og:description"
      content="Placeholder site description: lorem ipsum dolor sit amet, the personal website of Jane Placeholder."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
